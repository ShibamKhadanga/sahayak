<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahayak — Admin Panel</title>
<meta name="description" content="Manage forms, document types, and fields for the Sahayak operator console">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="toastContainer" class="toast-container"></div>

<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">स</div>
      <div class="brand-info">
        <h1>Sahayak</h1>
        <p>Admin Panel</p>
      </div>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-label">Navigation</span>
      <a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>

      <span class="nav-label">Admin</span>
      <button class="nav-item active" data-tab="forms">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Forms Catalog
      </button>
      <button class="nav-item" data-tab="doctypes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        Document Types
      </button>
      <button class="nav-item" data-tab="fields">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        Field Library
      </button>
    </nav>
  </aside>

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-title" id="tabTitle">Forms Catalog</div>
    <div class="topbar-actions">
      <button id="addBtn" class="btn btn-primary btn-sm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add New
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Forms Tab -->
    <div id="tab-forms" class="tab-panel active">
      <div class="ledger-wrap">
        <table class="ledger">
          <thead>
            <tr>
              <th class="col-no">#</th>
              <th>Form ID</th>
              <th>Name</th>
              <th>Category</th>
              <th>Documents</th>
              <th>Fields</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="formsTableBody">
            <tr class="empty-row"><td colspan="7">Loading forms…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Document Types Tab -->
    <div id="tab-doctypes" class="tab-panel">
      <div class="ledger-wrap">
        <table class="ledger">
          <thead>
            <tr>
              <th class="col-no">#</th>
              <th>Type Key</th>
              <th>Label</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="docTypesTableBody">
            <tr class="empty-row"><td colspan="4">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Fields Tab -->
    <div id="tab-fields" class="tab-panel">
      <div class="ledger-wrap">
        <table class="ledger">
          <thead>
            <tr>
              <th class="col-no">#</th>
              <th>Field Key</th>
              <th>Label</th>
              <th>Source Key</th>
              <th>Required</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="fieldsTableBody">
            <tr class="empty-row"><td colspan="6">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- Modal Overlay -->
<div id="modalOverlay" class="modal-overlay hidden"></div>

<!-- Form Editor Modal -->
<div id="formModal" class="modal hidden">
  <div class="modal-head">
    <h3 id="formModalTitle">Add Form</h3>
    <button class="btn-icon modal-close-btn" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <form id="formEditorForm" class="modal-body">
    <div class="field-row">
      <label>Form ID <span class="muted">(unique, lowercase, no spaces)</span></label>
      <input type="text" id="fmId" required placeholder="e.g. passport_new" pattern="[a-z0-9_]+">
    </div>
    <div class="field-row">
      <label>Form Name</label>
      <input type="text" id="fmName" required placeholder="e.g. Passport — New Application">
    </div>
    <div class="field-row">
      <label>Category</label>
      <input type="text" id="fmCategory" required placeholder="e.g. Identity, Revenue, Social Welfare">
    </div>
    <div class="field-row">
      <label>Required Documents <span class="muted">(comma-separated type keys)</span></label>
      <input type="text" id="fmDocs" placeholder="e.g. aadhaar, pan, photo">
      <div id="fmDocsHelp" class="chip-help"></div>
    </div>
    <div class="field-row">
      <label>Required Fields <span class="muted">(comma-separated field keys)</span></label>
      <input type="text" id="fmFields" placeholder="e.g. name, dob, gender, address">
      <div id="fmFieldsHelp" class="chip-help"></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost btn-sm modal-close-btn">Cancel</button>
      <button type="submit" class="btn btn-primary btn-sm">Save Form</button>
    </div>
  </form>
</div>

<!-- Document Type Modal -->
<div id="docTypeModal" class="modal hidden">
  <div class="modal-head">
    <h3 id="docTypeModalTitle">Add Document Type</h3>
    <button class="btn-icon modal-close-btn" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <form id="docTypeEditorForm" class="modal-body">
    <div class="field-row">
      <label>Type Key <span class="muted">(unique, lowercase)</span></label>
      <input type="text" id="dtKey" required placeholder="e.g. passport_copy" pattern="[a-z0-9_]+">
    </div>
    <div class="field-row">
      <label>Label</label>
      <input type="text" id="dtLabel" required placeholder="e.g. Copy of existing Passport">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost btn-sm modal-close-btn">Cancel</button>
      <button type="submit" class="btn btn-primary btn-sm">Save</button>
    </div>
  </form>
</div>

<!-- Field Library Modal -->
<div id="fieldModal" class="modal hidden">
  <div class="modal-head">
    <h3 id="fieldModalTitle">Add Field</h3>
    <button class="btn-icon modal-close-btn" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <form id="fieldEditorForm" class="modal-body">
    <div class="field-row">
      <label>Field Key <span class="muted">(unique, lowercase)</span></label>
      <input type="text" id="flKey" required placeholder="e.g. emergency_contact" pattern="[a-z0-9_]+">
    </div>
    <div class="field-row">
      <label>Label</label>
      <input type="text" id="flLabel" required placeholder="e.g. Emergency Contact Number">
    </div>
    <div class="field-row">
      <label>Source Key <span class="muted">(OCR extraction key, optional)</span></label>
      <input type="text" id="flSource" placeholder="e.g. emergency_contact">
    </div>
    <div class="field-row" style="flex-direction:row; align-items:center; gap:8px;">
      <input type="checkbox" id="flRequired">
      <label for="flRequired" style="font-size:13px; color:var(--text-secondary)">Required field</label>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost btn-sm modal-close-btn">Cancel</button>
      <button type="submit" class="btn btn-primary btn-sm">Save</button>
    </div>
  </form>
</div>

<script src="admin.js"></script>
</body>
</html>
